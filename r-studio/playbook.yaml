---
- hosts: 127.0.0.1
  become: yes
  become_user: root
  tasks:
    - name: Fail if running on Ubuntu < 22.04
      fail:
        msg: "These tasks should only be run on Ubuntu 22.04 or later"
      when: ansible_distribution != "Ubuntu" or ansible_distribution_version is version('22.04', '<')

    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - build-essential
          - software-properties-common
          - dirmngr
          - wget
          - ca-certificates
          - gnupg
        update_cache: true

    - name: Cpan apt key
      ansible.builtin.get_url:
        url: https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc
        dest: /etc/apt/keyrings/cran_ubuntu_key.asc
        mode: "0644"


    - name: Add R repository into sources list
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/cran_ubuntu_key.asc] https://cloud.r-project.org/bin/linux/ubuntu {{ ansible_distribution_release }}-cran40/"
        state: present

    - name: Add CRAN Packages
      ansible.builtin.apt_repository:
        repo: ppa:c2d4u.team/c2d4u4.0+
      when: ansible_distribution == "Ubuntu" and ansible_distribution_version is version('22.04', '==')

    # https://github.com/eddelbuettel/r2u
    # https://eddelbuettel.github.io/r2u/

    - name: Add R2U repository into sources list
      ansible.builtin.shell: |
        gpg --homedir /tmp --no-default-keyring \
          --keyring /usr/share/keyrings/r2u.gpg \
          --keyserver keyserver.ubuntu.com \
          --recv-keys A1489FE2AB99A21A 67C2D66C4B1D4339 51716619E084DAB9
      when: ansible_distribution == "Ubuntu" and ansible_distribution_version is version('26.04', '==')

    - name: Add R2U repository into sources list
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/r2u.sources
        content: |
          Types: deb
          URIs: https://r2u.stat.illinois.edu/ubuntu
          Suites: resolute
          Components: main
          Arch: amd64, arm64
          Signed-By: /usr/share/keyrings/r2u.gpg
      when: ansible_distribution == "Ubuntu" and ansible_distribution_version is version('26.04', '==')

    - name: Install R Base
      ansible.builtin.apt:
        name: r-base
        update_cache: true

    - name: Install r studio .deb package
      ansible.builtin.apt:
        deb: https://download2.rstudio.org/server/jammy/amd64/rstudio-server-2026.07.1-147-amd64.deb

    - name: Create systemd Rstudio config
      ansible.builtin.copy:
        src: rstudio-server-codio.service
        dest: /etc/systemd/system/rstudio-server-codio.service
        mode: "0644"


    - name: Copy Rstudio config
      ansible.builtin.copy:
        src: rserver.conf
        dest: /etc/rstudio/rserver.conf
        mode: "0644"

    - name: Change permission for databse
      ansible.builtin.file:
        recurse: true
        path: /var/lib/rstudio-server/
        owner: codio
        group: codio

    - name: Disable original Rstudio
      ansible.builtin.systemd:
        enabled: false
        state: stopped
        daemon_reload: true
        name: rstudio-server

    - name: Rstudio ensure restarted
      ansible.builtin.systemd:
        enabled: true
        state: restarted
        daemon_reload: true
        name: rstudio-server-codio

    - name: Restart Instructions
      ansible.builtin.debug:
        msg:
          - "INFO: Access to the r studio uses 8787 port, use {%raw%}{{domain8787}}{%endraw%}!"
