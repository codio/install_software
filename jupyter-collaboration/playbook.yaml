---
- hosts: 127.0.0.1
  become: true
  tasks:

    - name: Has jupyter
      command: which jupyter
      register: jupyter_path
      ignore_errors: yes
      become: yes
      become_user: codio
      become_method: su
      become_flags: -l

    - debug: var=jupyter_path

    - name: Fail if no jupyter
      fail:
        msg: "Jupyter is not installed"
      when: jupyter_path.stdout == ""

    # Jupyter Lab
    - name: Check JupyterLab version
      ansible.builtin.shell: |
        jupyter --version 2>/dev/null |
          sed -nE 's/^jupyterlab[[:space:]]*:[[:space:]]*(.*)$/\1/p'
      register: jupyterlab_version
      changed_when: false
      failed_when: false
      become: yes
      become_user: codio
      become_method: su
      become_flags: -l

    - name: Fail jupyter lab is less than 4.4 or does not exist
      fail:
        msg: "Jupyter Lab version must be 4.4 or higher"
      when: >
        jupyterlab_version.rc != 0 or
        jupyterlab_version.stdout | trim == '' or
        (jupyterlab_version.stdout | trim).split('.')[0] | int < 4 or
        ((jupyterlab_version.stdout | trim).split('.')[0] | int == 4 and
         (jupyterlab_version.stdout | trim).split('.')[1] | int < 4)

    - apt: update_cache=yes

    - name: Installing jupyter-collaboration-codio for jupyterlab >=4.4.x <4.6.0
      pip:
        name: jupyter-collaboration-codio
        extra_args: -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/
        state: present
        version: 4.4.6rc1
      become: yes
      become_user: codio
      become_method: su
      become_flags: -l
      register: aptout
      when: jupyterlab_version.stdout | trim is version('4.4', '>=') and jupyterlab_version.stdout | trim is version('4.6', '<')

    - debug: var=aptout
      when: jupyterlab_version.stdout | trim is version('4.4', '>=') and jupyterlab_version.stdout | trim is version('4.6', '<')

    - name: Installing jupyter-collaboration-codio for jupyterlab >= 4.6.0
      pip:
        name: jupyter-collaboration-codio
        extra_args: -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/
        state: present
        version: 5.0.6rc1
      become: yes
      become_user: codio
      become_method: su
      become_flags: -l
      register: aptout1
      when: jupyterlab_version.stdout | trim is version('4.6', '>=')

    - debug: var=aptout1
      when: jupyterlab_version.stdout | trim is version('4.6', '>=')

    - name: jupyter restarted
      systemd:
        enabled: yes
        state: restarted
        daemon_reload: yes
        name: jupyter
      when: ansible_distribution_version >= "16.04"